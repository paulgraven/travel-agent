<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Travel Agent</title><style>body{font:16px system-ui;background:#f5f6f8;color:#152238;margin:0}main{max-width:850px;margin:40px auto;padding:24px}.panel{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 16px #0001}button,select{padding:12px;border-radius:9px;border:1px solid #ccd2da;background:white;font:inherit}button{background:#173b61;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;border-bottom:1px solid #ddd;padding:12px}small{color:#556}h1{margin-top:0}</style><main><div class="panel"><h1>Personal Travel Agent</h1><p>Trip simulation · AAA ⇄ BBB · Example trip</p><div id="step"><label for="travelers">Who's traveling?</label> <select id="travelers"><option>Just me</option><option>Two adults</option><option>Whole family</option><option>Other travelers</option></select> <button onclick="compare()">Continue</button></div><p><small>Simulation only. No bookings, purchases, or live fares. Keep deployment private before connecting personal accounts.</small></p></div></main><script>function compare(){let f=document.querySelector('#travelers').value.includes('Whole family');document.querySelector('#step').innerHTML='<h2>Transportation comparison</h2><table><thead><tr><th>Option</th><th>Est. round-trip cost</th><th>Est. time</th><th>Convenience</th></tr></thead><tbody><tr><td>DEN Economy parking</td><td>$100–$120</td><td>50–75 min</td><td>'+(f?'Easiest with kids':'Drive yourself')+'</td></tr><tr><td>Uber/Lyft XL</td><td>$120–$250+</td><td>35–55 min</td><td>'+(f?'Install two car seats':'Door-to-door')+'</td></tr><tr><td>Central Park RTD + A Line</td><td>$48–$50</td><td>60–90 min</td><td>Cheapest; more transfers</td></tr></tbody></table><p><small>Est. time is one-way. Cost estimates are illustrative and unverified.</small></p><label for="mode">Choose transportation</label> <select id="mode"><option>DEN Economy parking</option><option>Uber/Lyft XL</option><option>Central Park RTD + A Line</option></select> <button onclick="schedule()">Show schedule</button>'}function schedule(){let v=document.querySelector('#mode').value;document.querySelector('#step').innerHTML='<h2>'+v+'</h2><p>Outbound: Example outbound flight — enter verified details.</p><p>Return: Example return flight — enter verified details.</p><p>'+(v.includes('RTD')?'Exact Central Park and DEN A Line departures and arrivals are <strong>not verified</strong>. Check the <a href="https://app.rtd-denver.com/route/A/schedule">official RTD timetable</a> before setting a departure schedule.':'Exact door-to-door timing requires current traffic and pickup or parking conditions.')+'</p><button onclick="location.reload()">Start over</button>'}</script></html>
